name: Build Spring Boot

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin


    - name: Build
      run: mvn clean package


    - name: Login GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}


    - name: Build Docker image
      run: |
        docker build \
        -t ghcr.io/ahitagni07/account-demo:${{ github.sha }} .


    - name: Push image
      run: |
        docker push \
        ghcr.io/ahitagni07/account-demo:${{ github.sha }}